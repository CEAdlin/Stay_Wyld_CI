{% extends "base.html" %}
{% block content %}
<section class="admin-section">

    <h1>Customers</h1>

    <table class="admin-table">
        <thead>
            <tr>
                <th>Name</th>
                <th>Email</th>
                <th>Phone</th>
                <th>Total Bookings</th>
                <th>Actions</th>
            </tr>
        </thead>

        <tbody>
            {% for customer in customers %}
            <tr>
                <td>{{ customer.username }}</td>
                <td>{{ customer.email }}</td>
                <td>{{ customer.profile.phone }}</td>
                <td>{{ customer.bookings.count }}</td>

                <td>
                    <a href="{% url 'admin_customer_detail' customer.id %}" class="crud-btn">View</a>

                    <button onclick="openPasswordModal('modify_customer', {{ customer.id }})" class="crud-btn">
                        Modify
                    </button>

                    <button onclick="openPasswordModal('delete_customer', {{ customer.id }})" class="crud-btn danger-btn">
                        Delete
                    </button>
                </td>
            </tr>
            {% endfor %}
        </tbody>
    </table>

</section>
{% endblock %}
