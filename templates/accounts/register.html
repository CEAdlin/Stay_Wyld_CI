{% extends "base.html" %}
{% load static %}

{% block content %}
<div class="auth-wrapper">
    <h2 class="auth-title">Create an Account</h2>

    <form method="POST">
        {% csrf_token %}

        {% if messages %}
            <div class="auth-messages">
                {% for message in messages %}
                    <p class="auth-error">{{ message }}</p>
                {% endfor %}
            </div>
        {% endif %}

        <div class="auth-field">
            <label>Full Name</label>
            <input type="text" name="full_name" placeholder="Your full name">
        </div>

        <div class="auth-field">
            <label>Email</label>
            <input type="email" name="email" placeholder="Your email address">
        </div>

        <div class="auth-field">
            <label>Phone Number</label>
            <input type="text" name="phone" placeholder="Your contact number">
        </div>

        <div class="auth-field">
            <label>Address</label>
            <textarea name="address" placeholder="Your full address"></textarea>
        </div>

        <div class="auth-field">
            <label>Password</label>
            <input type="password" name="password" placeholder="Create a password">
        </div>

        <div class="auth-field">
            <label>Confirm Password</label>
            <input type="password" name="confirm_password" placeholder="Confirm your password">
        </div>

        <button type="submit" class="crud-btn">Register</button>
    </form>

    <p class="auth-switch">
        Already have an account?
        <a href="{% url 'login' %}">Login here</a>
    </p>
</div>
{% endblock %}
